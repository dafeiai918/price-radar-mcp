[project]
name = "price-radar-mcp"
version = "1.0.0"
description = "模型价格雷达 MCP：比价 / 性价比排序 / 成本估算"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
price-radar-mcp = "price_radar_mcp:main"

[project.urls]
Homepage = "https://github.com/dafeiai918/price-radar-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["price_radar_mcp.py"]
